[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firerag"
version = "0.1.0"
description = "Explainable RAG for safety-critical engineering guidance: source-attributed answers, faithfulness checks, confidence scoring and abstention"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Tahami Ahmad" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "eval", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = [
  "D104", "D105", "D107", "D203", "D205", "D212", "D213", "D400", "D401", "D415",
  "B008",  # FastAPI's Depends() in argument defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"eval/*" = ["D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
